[project]
name = "litrex-gwas"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
    "pysbd>=0.3.4",
    "pyyaml>=6",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litrex_gwas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
